<!DOCTYPE html>
<html>
<head>
    <title>Map Test</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://gallimap.com/static/dist/js/gallimaps.vector.min.latest.js"></script>
    <script>
        fetch('/api/config').then(r=>r.json()).then(data => {
            if(!data.galliMapsApiKey) return alert('No key');
            const map = new maplibregl.Map({
                container: 'map',
                style: `https://map-init.gallimap.com/styles/light/style.json?accessToken=${data.galliMapsApiKey}`,
                center: [85.324, 27.7172],
                zoom: 12
            });
        });
    </script>
</body>
</html>
